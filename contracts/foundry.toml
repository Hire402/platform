[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 1_000_000
verbosity = 3

[profile.ci]
verbosity = 4

# Size-optimized profile for ON-CHAIN deploys. via-ir + runs=200 shrinks
# AdvancedEscrow (Hire402Escrow + the desk rail) under the EIP-170 24 KiB
# contract-size limit (default profile builds it at ~26.5 KB). Dev/CI keep
# the default profile (IR compilation is ~10x slower); this profile writes
# to its own out dir so dev artifacts are never clobbered.
[profile.size]
via_ir = true
optimizer = true
optimizer_runs = 200
out = "out-size"


